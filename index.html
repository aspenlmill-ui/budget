<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Budget">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Family Budget</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow phone column; summary tiles first, then the form, then the ledger. Tabs for the owner, single screen for the partner. */
:root{
  /* One deliberate look: black like the FB logo, white as the accent, color only for status */
  --bg:#000000; --surface:#111111; --ink:#F5F5F2; --muted:#9A9A95; --line:#262626;
  --accent:#F5F5F2; --accent-ink:#000000; --soft:#1C1C1C;
  --fire:#FF8A3D; --good:#3DDC84; --warn:#FFC53D; --bad:#FF5A4E;
  --bad-soft:#2A1412; --warn-soft:#2A2310; --good-soft:#0F2519; --fire-soft:#2B1A0E;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r:14px; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:14px 48px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,.num{font-family:var(--display)}
h1{font-size:22px;margin:0;letter-spacing:-.01em}
h2{font-size:17px;margin:0 0 10px;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1 0 auto;border:0;background:none;color:var(--muted);font:600 13px var(--body);padding:9px 11px;border-radius:999px;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
section{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.pools{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pool{display:flex;flex-direction:column;gap:6px;min-width:0}
.pool .left{font-size:28px;font-weight:700;line-height:1.05}
.pool.over .left{color:var(--bad)}
.bar{height:6px;border-radius:6px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px}
.pool.over .bar i{background:var(--bad)}
.st-fire .bar i{background:var(--fire)}.st-good .bar i{background:var(--good)}.st-warn .bar i{background:var(--warn)}.st-bad .bar i{background:var(--bad)}
.status{display:flex;align-items:center;gap:12px;border-radius:var(--r);padding:14px 16px;border:1px solid var(--line)}
.status .em{font-size:30px;line-height:1}
.status b{display:block;font-family:var(--display);font-size:18px}
.status.fire{background:var(--fire-soft);border-color:var(--fire)}.status.fire b{color:var(--fire)}
.status.good{background:var(--good-soft);border-color:var(--good)}.status.good b{color:var(--good)}
.status.warn{background:var(--warn-soft);border-color:var(--warn)}.status.warn b{color:var(--warn)}
.status.bad{background:var(--bad-soft);border-color:var(--bad)}.status.bad b{color:var(--bad)}
.sdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle}
.sdot.fire{background:var(--fire)}.sdot.good{background:var(--good)}.sdot.warn{background:var(--warn)}.sdot.bad{background:var(--bad)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--soft);color:var(--ink);width:fit-content}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.hero{display:flex;flex-direction:column;gap:6px;padding:20px 16px}
.hero .big{font-size:56px;font-weight:700;line-height:1;letter-spacing:-.02em}
.hero.over .big{color:var(--bad)}
form,.form{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1;min-width:120px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
input,select{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 11px;width:100%}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.check{display:flex;align-items:center;gap:8px;font-size:14px}
.check input{width:20px;height:20px}
.btn{font:600 15px var(--body);border:0;border-radius:10px;padding:12px 14px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.sm{font-size:13px;padding:7px 10px}
.seg{display:flex;gap:6px}
.seg button{flex:1;font:600 14px var(--body);padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .grow{flex:1;min-width:0}
.item .grow div{overflow-wrap:anywhere}
.x{border:0;background:none;color:var(--muted);font:600 12px var(--body);cursor:pointer;padding:6px}
.x.armed{color:var(--bad)}
.acct{display:grid;grid-template-columns:1fr 120px auto;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.acct:first-of-type{border-top:0}.acct input{padding:7px 8px;font-size:15px;text-align:right}.acct>b{text-align:right}
.kv.tot{border-top:1px solid var(--line);margin-top:4px;padding-top:8px}
.bucket{border-top:1px solid var(--line)}.bucket:first-child{border-top:0}
.bk-head{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:4px 10px;width:100%;padding:12px 2px}
.bk-head:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.bk-name{font-weight:600;min-width:0;overflow-wrap:anywhere}.bk-amt{font-weight:700;white-space:nowrap}
.bk-bar{grid-column:1/-1;height:4px;border-radius:4px;background:var(--soft);overflow:hidden}.bk-bar i{display:block;height:100%;background:var(--accent)}
.bk-note{grid-column:1/-1}
.bk-actions{display:flex;flex-wrap:wrap;gap:6px;padding:0 0 12px}.bk-actions input{max-width:110px;padding:7px 8px;font-size:15px}
.dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--line);flex-shrink:0}
.dot.ok{background:var(--good);border-color:var(--good)}
.dot.late{border-color:var(--bad)}
.alert{border-radius:var(--r);padding:14px;background:var(--bad-soft);display:flex;flex-direction:column;gap:10px}
.alert strong{color:var(--bad)}
.alert .opts{display:flex;flex-wrap:wrap;gap:8px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0}
.kv b{font-family:var(--display);font-variant-numeric:tabular-nums}
.split{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:baseline}
.split .tot{border-top:1px solid var(--line);padding-top:6px}
.tbl{overflow-x:auto}
.bill{display:grid;grid-template-columns:1fr 92px 30px;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.bill:first-child{border-top:0}
.bill input{padding:7px 8px;font-size:15px}
.bill .meta{font-size:12px;color:var(--muted)}
.goal{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.goal:first-child{border-top:0}
.goal.done{opacity:.6}
.goal .top{display:flex;justify-content:space-between;gap:10px;align-items:center}
.goal .add{display:flex;gap:6px}
.goal .add input{max-width:110px;padding:7px 8px;font-size:15px}
.empty{padding:18px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
@media (max-width:380px){.pools{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .3s ease}}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0}
.logo{width:34px;height:34px;border-radius:9px;flex-shrink:0}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.login{max-width:420px;margin:8vh auto 0;display:flex;flex-direction:column;gap:14px;text-align:center}
.login .card{text-align:left}
.logo-big{width:88px;height:88px;border-radius:22px;margin:0 auto}
.reload{display:flex;flex-direction:column}
.rl{display:grid;grid-template-columns:1.1fr 1fr 1.3fr 1.2fr;gap:6px;align-items:end;padding:10px 0;border-top:1px solid var(--line)}
.rl:first-child{border-top:0}
.rl .label{font-size:10px;letter-spacing:.05em}
.rl-name{font-weight:600;align-self:center;overflow-wrap:anywhere}
@media (max-width:380px){.rl{grid-template-columns:1fr 1fr}.rl-name{grid-column:1/-1}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
</head>
<body>

<div class="wrap" id="app">
  <header><div><div class="label">Mill family</div><h1>Weekly money</h1></div></header>
  <div class="empty">Connecting to your budget… Spending, cushions and the plan appear here once it loads.</div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
const BASE=["household","aspen","grace","extras"];
let POOLS=[...BASE];
const NAMES={household:"Household",aspen:"Me",grace:"Partner",extras:"Extras"};
const NOTES={household:"Groceries, eating out, pets",aspen:"Personal + gas",grace:"Personal + gas",extras:"Gifts, haircuts, oil changes, odds and ends"};
const HCATS=["Groceries","Eating out","Pets"];
const DAY=864e5;
const S={ready:false,owner:false,view:"grace",tab:"week",settings:null,settingsLoaded:false,txns:[],moves:[],events:[],plan:null,gPool:"grace",planMissing:false};
let db=null;
try{S.tab=localStorage.getItem("mfb-tab")||"week"}catch(e){}

const pad=n=>String(n).padStart(2,"0");
const todayS=()=>{const t=new Date();return `${t.getFullYear()}-${pad(t.getMonth()+1)}-${pad(t.getDate())}`};
const dn=s=>{const [y,m,d]=s.split("-").map(Number);return Math.round(Date.UTC(y,m-1,d)/DAY)};
const ds=n=>new Date(n*DAY).toISOString().slice(0,10);
const pretty=n=>new Date(n*DAY).toLocaleDateString("en-US",{month:"short",day:"numeric",weekday:"short",timeZone:"UTC"});
const short=n=>new Date(n*DAY).toLocaleDateString("en-US",{month:"short",day:"numeric",timeZone:"UTC"});
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=(n,c)=>{const v=Math.round((+n||0)*100)/100;const s=Math.abs(v).toLocaleString("en-US",{minimumFractionDigits:c?2:0,maximumFractionDigits:c?2:0});return (v<0?"−$":"$")+s};
const m0=n=>money(n,false), m2=n=>money(n,true);
const num=v=>{const n=parseFloat(String(v).replace(/[$,]/g,""));return isFinite(n)?Math.round(n*100)/100:NaN};

function anchor(){return S.settings?.anchor||"2026-09-25"}
/* Weeks run 7 days from the anchor; a manual "Start new week" begins a new week early and the 7-day rhythm continues from there. */
function weekStarts(){
  const t=dn(todayS()),a=dn(anchor());
  const man=(S.settings?.starts||[]).map(dn).filter(x=>x>a).sort((x,y)=>x-y);
  const out=[];let w=a;
  while(w<=t){out.push(w);let nx=w+7;const m=man.find(x=>x>w&&x<nx);if(m!==undefined)nx=m;w=nx}
  return out.length?out:[a];
}
function wk(s){const L=weekStarts(),n=dn(s);let r=L[0];for(const w of L){if(w<=n)r=w;else break}return r}
function nextReset(){const L=weekStarts();return L[L.length-1]+7}
function budgetFor(p,w){
  const h=[...(S.settings?.history||[])].sort((a,b)=>dn(a.from)-dn(b.from));
  let b=0;for(const e of h){if(dn(e.from)<=w)b=+e[p]||0}return b;
}
function compute(){
  const cw=wk(todayS()),R={};
  POOLS.forEach(p=>R[p]={adj:{},spent:{},cush:0});
  for(const t of S.txns){const r=R[t.pool];if(!r)continue;
    if(t.from==="cushion")r.cush-=t.amount;else{const w=wk(t.date);r.spent[w]=(r.spent[w]||0)+t.amount}}
  const ap=(ep,amt,w)=>{const [k,p]=String(ep).split(":");if(!R[p])return;
    if(k==="week")R[p].adj[w]=(R[p].adj[w]||0)+amt;else if(k==="cushion")R[p].cush+=amt};
  for(const m of S.moves){const w=wk(m.date);ap(m.from,-m.amount,w);ap(m.to,m.amount,w)}
  const out={cw};const L=weekStarts();
  for(const p of POOLS){const r=R[p];let c=r.cush;
    for(const w of L){if(w<cw)c+=budgetFor(p,w)+(r.adj[w]||0)-(r.spent[w]||0)}
    const budget=budgetFor(p,cw),alloc=budget+(r.adj[cw]||0),spent=r.spent[cw]||0;
    out[p]={budget,alloc,spent,left:alloc-spent,cushion:c}}
  return out;
}

function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2600)}
function fail(e){console.error(e);toast(e?.code==="42501"?"You don't have permission to change that.":"Couldn't save. Check your connection and try again.")}

/* ---------- render ---------- */
function render(){
  const app=document.getElementById("app");
  if(!S.ready){return}
  if(!db){app.innerHTML=`<header><div><div class="label">Weekly budget</div><h1>Weekly money</h1></div></header><div class="empty">This budget syncs through Claude. Open it from the Claude app or claude.ai while signed in to see and log spending.</div>`;return}
  if(!S.settingsLoaded){return}
  if(!S.settings){app.innerHTML=S.owner?firstRun():`<header><div><div class="label">Weekly budget</div><h1>Almost ready</h1></div></header><div class="empty">This budget hasn't been set up yet. Once the owner sets it up, your weekly number shows here.</div>`;return}
  app.innerHTML=S.view==="aspen"?aspenView():graceView();
}

function weekLine(c){const n=nextReset();return `Week of ${short(c.cw)} · refills ${pretty(n)}`}

function graceView(){
  const c=compute(),g=c.grace,h=c.household;
  const pool=S.gPool;
  const pp=partnerPools();const mine=S.txns.filter(t=>(t.pool==="grace"||pp.includes(t.pool)||String(t.pool).startsWith("event:"))&&wk(t.date)===c.cw).sort((a,b)=>b.ts-a.ts);
  const evs=activeEvents();
  return `
  <header><div><div class="label">${esc(weekLine(c))}</div><h1 class="brand"><img src="icon.svg" alt="" class="logo">${esc(NAMES.grace)}'s money</h1></div>
    ${S.owner?`<button class="btn ghost sm" data-act="view" data-v="aspen">Back to my view</button>`:""}</header>
  ${statusBanner(c,["grace",...pp])}
  <div class="card hero st-${poolStatus(g,weekFrac(c))} ${g.left<0?"over":""}">
    <div class="label">You can spend this week</div>
    <div class="big num">${m2(Math.max(g.left,g.left<0?g.left:0))}</div>
    ${g.left<0?`<div class="chip bad">${m2(-g.left)} over. Let ${esc(NAMES.aspen)} know so money can be moved to cover it.</div>`
      :`<div class="muted small">${m0(g.spent)} spent of ${m0(g.alloc)}</div>`}
    <div class="bar"><i style="width:${pct(g.spent,g.alloc)}%"></i></div>
    ${g.cushion>0?`<div class="chip">Saved from past weeks: ${m2(g.cushion)}</div>`:""}
    <div class="muted small">${esc(pretty(nextReset()))}: ${m0(budgetFor("grace",nextReset()))} gets added${g.left>0?`, and the ${m2(g.left)} you have left goes to your saved money`:""}.</div>
  </div>
  <div class="card pool st-${poolStatus(h,weekFrac(c))} ${h.left<0?"over":""}">
    <div class="bar" style="order:9"><i style="width:${pct(h.spent,h.alloc)}%"></i></div>
    <div class="label"><span class="sdot ${poolStatus(h,weekFrac(c))}"></span>Household this week</div>
    <div class="left num">${m2(h.left)}</div>
    <div class="muted small">${esc(NOTES.household)}</div>
  </div>
  ${partnerPools().filter(p=>p!=="household").map(p=>{const x=c[p],st=poolStatus(x,weekFrac(c));return `<div class="card pool st-${st} ${x.left<0?"over":""}">
    <div class="label"><span class="sdot ${st}"></span>${esc(NAMES[p])} this week</div><div class="left num">${m2(x.left)}</div>
    <div class="bar"><i style="width:${pct(x.spent,x.alloc)}%"></i></div></div>`}).join("")}
  ${evs.map(e=>eventCard(e,false)).join("")}
  ${logForm(pool,true)}
  <div class="card"><h2>This week</h2>${txList(mine,true)}</div>
  ${pushButton()}
  <button class="btn ghost" data-act="signout">Sign out</button>`;
}

function pct(a,b){return b>0?Math.max(0,Math.min(100,a/b*100)):(a>0?100:0)}

/* ---------- special budgets (weddings, trips) ---------- */
function activeEvents(){return S.events.filter(e=>e.active!==false).sort((a,b)=>(a.created||0)-(b.created||0))}
function poolName(p){if(NAMES[p])return NAMES[p];if(String(p).startsWith("event:")){const e=S.events.find(x=>"event:"+x.id===p);return e?e.name:"Special budget"}return p}
function evStats(e){const key="event:"+e.id;
  let budget=+e.budget||0;for(const m of S.moves){if(m.to===key)budget+=m.amount;if(m.from===key)budget-=m.amount}
  const tx=S.txns.filter(t=>t.pool===key).sort((a,b)=>b.ts-a.ts);const spent=tx.reduce((s,t)=>s+t.amount,0);
  return {budget,spent,left:budget-spent,tx}}
function eventCard(e,owner){const s=evStats(e);return `<div class="card pool ${s.left<0?"over":""}">
  <div class="top" style="display:flex;justify-content:space-between;gap:8px;align-items:baseline"><div class="label">${esc(e.name)}</div>${e.active===false?`<span class="chip">Closed</span>`:""}</div>
  <div class="left num">${m2(s.left)}</div>
  <div class="bar"><i style="width:${pct(s.spent,s.budget)}%"></i></div>
  <div class="muted small">${m2(s.spent)} spent of ${m2(s.budget)}${s.left<0?` · ${m2(-s.left)} over`:""}</div>
  ${owner&&s.tx.length?`<details><summary class="small">What was bought (${s.tx.length})</summary>${txList(s.tx,false,true)}</details>`:""}
  ${owner?`<div class="row" style="margin-top:4px">${e.active===false
      ?`<button class="btn sm ghost" data-act="evopen" data-id="${esc(e.id)}">Reopen</button>`
      :`<button class="btn sm ghost" data-act="evclose" data-id="${esc(e.id)}">Close it out</button>`}</div>`:""}
</div>`}

function specialTab(){
  const act=activeEvents(),closed=S.events.filter(e=>e.active===false);
  return `<section>
    <div class="muted small">Special budgets are for one-off things like a wedding, a trip or a birthday. They sit outside the weekly cards, so a wedding doesn't wreck a normal week. Log purchases to them from the Week tab.</div>
    ${act.length?act.map(e=>eventCard(e,true)).join(""):`<div class="empty">No special budgets yet. Add one below, like "Wedding, $200".</div>`}
    <form class="card" id="evf"><h2>New special budget</h2>
      <div class="row"><label class="f">Name<input id="ev-name" placeholder="Wyoming Christmas trip" autocomplete="off"></label>
      <label class="f">Budget<input id="ev-amt" inputmode="decimal" placeholder="0.00"></label></div>
      <button class="btn" type="submit">Add special budget</button>
      <div class="muted small">${esc(NAMES.grace)} sees open special budgets and can log to them. If one runs over, add money from the Move money tab.</div>
    </form>
    ${closed.length?`<details class="card"><summary><b>Closed (${closed.length})</b></summary><div style="display:flex;flex-direction:column;gap:10px;margin-top:10px">${closed.map(e=>eventCard(e,true)).join("")}</div></details>`:""}
  </section>`;
}

function logForm(pool,grace){
  const pools=(grace?["grace",...partnerPools()]:POOLS).concat(activeEvents().map(e=>"event:"+e.id));
  if(!pools.includes(pool))pool=pools[0];

function rescueBanner(c){

    if(c[p].cushion>0)opts.push([`cushion:${p}`,`${NAMES[p]}'s cushion`,Math.min(need,c[p].cushion)]);
    for(const q of POOLS)if(q!==p&&c[q].cushion>0)opts.push([`cushion:${q}`,`${NAMES[q]}'s cushion`,Math.min(need,c[q].cushion)]);
    for(const q of POOLS)if(q!==p&&c[q].left>0)opts.push([`week:${q}`,`${NAMES[q]} this week`,Math.min(need,c[q].left)]);

  }).join("");
}

/* ---------- budget health: fire / green / yellow / red ---------- */
function weekFrac(c){const len=Math.max(1,nextReset()-c.cw),day=dn(todayS())-c.cw+1;return Math.min(1,Math.max(0,day/len))}
function poolStatus(x,frac){
  if(x.left<-0.004)return x.cushion+x.left>=0?"warn":"bad";
  if(x.alloc<=0)return "good";
  const used=x.spent/x.alloc;
  if(used>=0.9&&frac<0.85)return "warn";
  if(used>frac+0.15)return "warn";
  if(frac>=0.3&&used<=frac*0.7)return "fire";
  return "good";
}
function overallStatus(c,pools){
  const f=weekFrac(c),st=pools.map(p=>poolStatus(c[p],f));
  if(st.includes("bad"))return "bad";if(st.includes("warn"))return "warn";
  const spent=pools.reduce((s,p)=>s+c[p].spent,0),alloc=pools.reduce((s,p)=>s+c[p].alloc,0);
  if(f>=0.3&&alloc>0&&spent/alloc<=f*0.7)return "fire";
  return "good";
}
const STATUS={fire:["🔥","Ahead of plan","Spending is well under pace this week. Nice."],good:["🟢","On track","Spending is right where it should be."],warn:["🟡","Be careful","Something is running ahead of pace or close to its limit."],bad:["🔴","Over budget","A card is over and its cushion can't cover it. Move money or pause spending."]};
function statusBanner(c,pools){const s=overallStatus(c,pools),[em,t,d]=STATUS[s];
  return `<div class="status ${s}"><span class="em" aria-hidden="true">${em}</span><div><b>${t}</b><div class="small muted">${d}</div></div></div>`}

/* Bills: this month's cycle per bill, with a paid check. */
function dayOf(b){const n=parseInt(String(b.day||"").replace(/\D/g,""),10);return n>=1&&n<=31?n:null}
function dueIn(y,m,d){const last=new Date(Date.UTC(y,m+1,0)).getUTCDate();return Math.round(Date.UTC(y,m,Math.min(d,last))/DAY)}
function nextPayday(){const a=dn(S.plan?.payAnchor||anchor()),t=dn(todayS());let p=a;while(p<=t)p+=14;return p}
function billRows(){
  const P=S.plan,phase=P.postClosing?"post":"pre",t=new Date(),y=t.getFullYear(),m=t.getMonth(),today=dn(todayS());
  const paid=new Set(P.paid||[]);
  return (P.bills||[]).map((b,i)=>({b,i})).filter(x=>x.b.phase==="both"||x.b.phase===phase).map(x=>{
    const d=dayOf(x.b);if(d===null)return {...x,due:null,paid:paid.has(x.b.name+"|"+ym(y,m)),key:x.b.name+"|"+ym(y,m)};
    const due=dueIn(y,m,d),key=x.b.name+"|"+ds(due).slice(0,7);
    return {...x,due,key,paid:paid.has(key),late:!paid.has(key)&&due<today};
  }).sort((a,b)=>(a.due??1e9)-(b.due??1e9));
}
function ym(y,m){return `${y}-${pad(m+1)}`}
function billsCard(){

        <div class="meta" style="grid-column:1/-1;display:flex;gap:14px;flex-wrap:wrap">
          <label class="check small"><input type="checkbox" data-act="billauto" data-i="${i}" ${b.auto===false?"":"checked"}> Autopay on due date</label>
          <label class="check small">From <select data-act="billfrom" data-i="${i}" style="width:auto;padding:4px 6px;font-size:13px"><option value="bills" ${b.from!=="savings"?"selected":""}>${esc(L().bills)}</option><option value="savings" ${b.from==="savings"?"selected":""}>${esc(L().save)}</option></select></label></div>

/* ---------- autopay: bills come out on their due date ---------- */
function dueBeforePayday(acct){
  if(!S.plan)return 0;const rows=billRows().filter(r=>!acct||billAcct(r.b)===acct),pay=nextPayday(),t=new Date(),y=t.getFullYear(),m=t.getMonth();let sum=0;
  for(const r of rows){const d=dayOf(r.b);if(d===null)continue;if(!r.paid&&r.due<pay)sum+=+r.b.amt||0;
    const nx=dueIn(m===11?y+1:y,(m+1)%12,d);if(nx<pay&&nx>r.due)sum+=+r.b.amt||0}
  return sum;
}
function runAutopay(){
  if(!S.owner||!S.plan)return;const P=S.plan,today=dn(todayS());
  if(!P.autoStart){P.autoStart=todayS();savePlan()}
  const start=dn(P.autoStart),skip=new Set(P.skipAuto||[]);let changed=0;const paid=new Set(P.paid||[]);
  for(const r of billRows()){
    if(r.b.auto===false||r.due===null||r.paid||r.due>today||skip.has(r.key)||paid.has(r.key))continue;
    if(r.due<Math.max(start,r.b.added?dn(r.b.added):start))continue;
    const amt=+r.b.amt||0;paid.add(r.key);
    P.paidLog=(P.paidLog||[]).filter(x=>x.key!==r.key).concat([{key:r.key,amount:amt,date:ds(r.due),auto:true,acct:billAcct(r.b)}]);
    acctAdjust(billAcct(r.b),-amt);changed++;
  }
  if(changed){P.paid=[...paid];savePlan();toast(`${changed} bill${changed>1?"s":""} paid automatically`)}
}
/* ---------- what if I spend ---------- */
function runScenario(amt,pool){
  const c=compute(),steps=[];let need=amt;
  const take=(label,avail,ep)=>{if(need<=0.004||!(avail>0))return;const x=Math.min(need,avail);steps.push({label,x,ep});need-=x};
  if(pool!=="none"){take(`${NAMES[pool]} this week`,c[pool].left,null);take(`${NAMES[pool]}'s cushion`,c[pool].cushion,`cushion:${pool}`)}
  if(pool!=="extras"){take(`${NAMES.extras} this week`,c.extras.left,"week:extras");take(`${NAMES.extras} cushion`,c.extras.cushion,"cushion:extras")}
  for(const q of POOLS)if(q!==pool&&q!=="extras")take(`${NAMES[q]}'s cushion`,c[q].cushion,`cushion:${q}`);
  if(S.plan){const P=S.plan,bal=+P.accounts?.usaa||0,inB=(P.goals||[]).filter(g=>!g.done).reduce((s,g)=>s+(+g.saved||0),0);
    take(`${L().save}, unassigned and above the floor`,Math.max(0,bal-Math.max(+P.floor||0,0)-inB),"usaa")}
  return {steps,short:Math.max(0,Math.round(need*100)/100),pool,amt};
}

document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act;
  if(a==="tab"){S.tab=b.dataset.t;try{localStorage.setItem("mfb-tab",S.tab)}catch(_){}render();return}
  if(a==="view"){S.view=b.dataset.v;render();window.scrollTo(0,0);return}
  if(a==="pool"){e.preventDefault();if(S.view==="grace")S.gPool=b.dataset.p;else S.aPool=b.dataset.p;render();document.getElementById("lf-amt")?.focus();return}
  if(a==="newweek"){if(!arm(b,"Tap again to start the new week"))return;
    const t=todayS(),starts=[...(S.settings?.starts||[])].filter(x=>x!==t);starts.push(t);
    try{await saveSettings({starts});toast("New week started. Leftovers moved to cushions.")}catch(err){fail(err)}
    return}
  if(a==="deltx"||a==="delmv"||a==="delbill"||a==="deldebt"){if(!arm(b))return;
    if(a==="deltx")db.doc("txns/"+b.dataset.id).delete().then(()=>toast("Deleted")).catch(fail);
    if(a==="delmv")db.doc("moves/"+b.dataset.id).delete().then(()=>toast("Move undone")).catch(fail);
    if(a==="delbill"){S.plan.bills.splice(+b.dataset.i,1);render();savePlan()}
    if(a==="deldebt"){S.plan.debts.splice(+b.dataset.i,1);render();savePlan()}
    return}
  if(a==="payopen"){S.payOpen=b.dataset.key;render();document.getElementById("pf-amt")?.focus();return}
  if(a==="paycancel"){S.payOpen=null;render();return}
  if(a==="billundo"){const k=b.dataset.key,info=(S.plan.paidLog||[]).find(x=>x.key===k);
    if(info&&info.acct)acctAdjust(info.acct,+info.amount||0);
    S.plan.paid=(S.plan.paid||[]).filter(x=>x!==k);S.plan.paidLog=(S.plan.paidLog||[]).filter(x=>x.key!==k);

function reloadCard(c){
  const n=nextReset();
  const rows=POOLS.map(p=>({p,add:budgetFor(p,n),left:c[p].left,cush:c[p].cushion}));
  const totalAdd=rows.reduce((s,r)=>s+r.add,0),totalLeft=rows.reduce((s,r)=>s+r.left,0);
  return `<div class="card"><h2>Reload ${esc(pretty(n))}</h2>
    <div class="small muted">Add these amounts when the week resets. Whatever is left now becomes cushion, so it isn't lost.</div>
    <div class="reload">${rows.map(r=>`<div class="rl">
      <div class="rl-name">${esc(NAMES[r.p])}</div>
      <div><div class="label">Add</div><b class="num">${m0(r.add)}</b></div>
      <div><div class="label">Left → cushion</div><b class="num" style="color:${r.left<0?"var(--bad)":"var(--good)"}">${m2(r.left)}</b></div>
      <div><div class="label">Cushion after</div><b class="num">${m2(r.cush+r.left)}</b></div></div>`).join("")}</div>
    <div class="kv"><span>Total to add</span><b>${m0(totalAdd)}</b></div>
    <div class="kv"><span>Total rolling into cushions</span><b>${m2(totalLeft)}</b></div>
  </div>`;
}

});

/* ---------- notifications ---------- */
function b64(s){const p="=".repeat((4-s.length%4)%4);const r=atob((s+p).replace(/-/g,"+").replace(/_/g,"/"));return Uint8Array.from([...r].map(c=>c.charCodeAt(0)))}
async function enablePush(btn){
  const ios=/iphone|ipad/i.test(navigator.userAgent),standalone=window.navigator.standalone||matchMedia("(display-mode: standalone)").matches;
  if(ios&&!standalone){toast("First add this app to your Home Screen: Share → Add to Home Screen. Then open it from there.");return}
  if(!("serviceWorker" in navigator)||!("PushManager" in window)){toast("This browser can't show notifications");return}
  try{
    const perm=await Notification.requestPermission();if(perm!=="granted"){toast("Notifications are turned off for this app in your phone's settings");return}
    const reg=await navigator.serviceWorker.register("sw.js");await navigator.serviceWorker.ready;
    const sub=(await reg.pushManager.getSubscription())||await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64(VAPID)});
    const j=sub.toJSON();
    chk(await sb.from("push_subscriptions").upsert({user_id:ME,endpoint:j.endpoint,p256dh:j.keys.p256dh,auth_key:j.keys.auth,updated_at:new Date().toISOString()},{onConflict:"endpoint"}));
    toast("You'll get your numbers every night at 7 PM");if(btn)btn.textContent="Notifications are on";
  }catch(err){console.error(err);toast("Couldn't turn on notifications. Try again.")}
}
function pushButton(){return `<button class="btn ghost" data-act="push">Turn on 7 PM notifications</button>`}

/* ---------- start ---------- */
async function start(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){showLogin();return}
  ME=session.user.id;
  const mem=chk(await sb.from("household_members").select("household_id").eq("user_id",ME).maybeSingle());
  if(!mem){showLogin("household");return}
  HID=mem.household_id;
  const hh=chk(await sb.from("households").select("created_by,join_code").eq("id",HID).maybeSingle());S.joinCode=hh?.join_code||"";
  S.owner=hh?.created_by===ME;S.view=S.owner?"aspen":"grace";
  try{await Promise.all(Object.values(LOAD).map(f=>f()))}catch(err){fail(err)}
  S.ready=true;render();runAutopay();
  if(channel)sb.removeChannel(channel);
  channel=sb.channel("wb-"+HID);
  for(const [t,k] of [["wb_settings","settings"],["wb_txns","txns"],["wb_txn_notes","txns"],["wb_moves","moves"],["wb_events","events"],["wb_plan","plan"]]){
    if(k==="plan"&&!S.owner)continue;
    channel.on("postgres_changes",{event:"*",schema:"public",table:t,filter:`household_id=eq.${HID}`},()=>{LOAD[k]().then(render).catch(()=>{})});
  }
  channel.subscribe();
  document.addEventListener("visibilitychange",()=>{if(!document.hidden&&HID)Promise.all(Object.values(LOAD).map(f=>f())).then(render).catch(()=>{})});
}
sb.auth.onAuthStateChange((ev)=>{if(ev==="PASSWORD_RECOVERY")showLogin("recover")});
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
if(/type=recovery/.test(location.hash)){/* recovery link: onAuthStateChange shows the form */}else start();
</script>
