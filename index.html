<style>
/* Layout: one narrow phone column; summary tiles first, then the form, then the ledger. Tabs for the owner, single screen for the partner. */

:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

<body>

<div class="wrap" id="app">
  <header><div><div class="label">Mill family</div><h1>Family Budget</h1></div></header>
  <div class="empty">Connecting to your budget… Spending, cushions and the plan appear here once it loads.</div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
function setTheme(v){try{localStorage.setItem("fb-theme",v)}catch(_){}if(v==="light"||v==="dark")document.documentElement.setAttribute("data-theme",v);else document.documentElement.removeAttribute("data-theme");S&&(S.theme=v)}
function getTheme(){try{return localStorage.getItem("fb-theme")||"light"}catch(_){return "light"}}
const BASE=["household","aspen","grace","extras"];
let POOLS=[...BASE];
const NAMES={household:"Household",aspen:"Me",grace:"Partner",extras:"Extras"};
const NOTES={household:"Groceries, eating out, pets",aspen:"Personal + gas",grace:"Personal + gas",extras:"Gifts, haircuts, oil changes, odds and ends"};
const HCATS=["Groceries","Eating out","Pets"];
const DAY=864e5;
const S={ready:false,owner:false,view:"grace",tab:"week",settings:null,settingsLoaded:false,txns:[],moves:[],events:[],plan:null,gPool:"grace",planMissing:false};
let db=null;
try{S.tab=localStorage.getItem("mfb-tab")||"week"}catch(e){}

const pad=n=>String(n).padStart(2,"0");
const todayS=()=>{const t=new Date();return `${t.getFullYear()}-${pad(t.getMonth()+1)}-${pad(t.getDate())}`};
const dn=s=>{const [y,m,d]=s.split("-").map(Number);return Math.round(Date.UTC(y,m-1,d)/DAY)};
const ds=n=>new Date(n*DAY).toISOString().slice(0,10);
const pretty=n=>new Date(n*DAY).toLocaleDateString("en-US",{month:"short",day:"numeric",weekday:"short",timeZone:"UTC"});
const short=n=>new Date(n*DAY).toLocaleDateString("en-US",{month:"short",day:"numeric",timeZone:"UTC"});
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=(n,c)=>{const v=Math.round((+n||0)*100)/100;const s=Math.abs(v).toLocaleString("en-US",{minimumFractionDigits:c?2:0,maximumFractionDigits:c?2:0});return (v<0?"−$":"$")+s};
const m0=n=>money(n,false), m2=n=>money(n,true);
const num=v=>{const n=parseFloat(String(v).replace(/[$,]/g,""));return isFinite(n)?Math.round(n*100)/100:NaN};

function anchor(){return S.settings?.anchor||"2026-09-25"}
/* Budget periods: weekly, every 2 weeks, or monthly (on the 1st). A manual "start new" or a change of period type begins a new period early. */
const PERIOD={week:{days:7,noun:"week",adj:"Weekly",this:"this week",per:"week",label:"Weekly"},biweek:{days:14,noun:"pay period",adj:"Every-2-weeks",this:"this pay period",per:"2 weeks",label:"Every 2 weeks"},month:{days:30.44,noun:"month",adj:"Monthly",this:"this month",per:"month",label:"Monthly"}};
function periodSegs(){const s=S.settings||{};return s.periods&&s.periods.length?s.periods:[{from:anchor(),kind:"week"}]}
function kindAt(w){let k=periodSegs()[0].kind;for(const g of periodSegs())if(dn(g.from)<=w)k=g.kind;return PERIOD[k]?k:"week"}
function nextAfter(w){const k=kindAt(w);if(k==="week")return w+7;if(k==="biweek")return w+14;const d=new Date(w*DAY);return Math.round(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,1)/DAY)}
function forcedStarts(){const a=dn(anchor());return [...(S.settings?.starts||[]),...periodSegs().slice(1).map(g=>g.from)].map(dn).filter(x=>x>a).sort((x,y)=>x-y)}
function stepFrom(w,forced){let nx=nextAfter(w);const m=forced.find(x=>x>w&&x<nx);return m!==undefined?m:nx}
function weekStarts(){
  const t=dn(todayS()),a=dn(anchor()),forced=forcedStarts();
  const out=[];let w=a;
  while(w<=t){out.push(w);w=stepFrom(w,forced)}
  return out.length?out:[a];
}
function PER(){const L=weekStarts();return PERIOD[kindAt(L[L.length-1])]}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}
function perCheckFactor(){return 14/PER().days}
function wk(s){const L=weekStarts(),n=dn(s);let r=L[0];for(const w of L){if(w<=n)r=w;else break}return r}
function nextReset(){const L=weekStarts();return stepFrom(L[L.length-1],forcedStarts())}
function budgetFor(p,w){
  const h=[...(S.settings?.history||[])].sort((a,b)=>dn(a.from)-dn(b.from));
  let b=0;for(const e of h){if(dn(e.from)<=w)b=+e[p]||0}return b;
}
function compute(){
  const cw=wk(todayS()),R={};
  POOLS.forEach(p=>R[p]={adj:{},spent:{},cush:0});
  for(const t of S.txns){const r=R[t.pool];if(!r)continue;
    if(t.from==="cushion")r.cush-=t.amount;else{const w=wk(t.date);r.spent[w]=(r.spent[w]||0)+t.amount}}
  const fs=forcedStarts();
  const ap=(ep,amt,w)=>{const [k,p]=String(ep).split(":");if(!R[p])return;
    if(k==="week")R[p].adj[w]=(R[p].adj[w]||0)+amt;else if(k==="cushion")R[p].cush+=amt;
    else if(k==="next"){const nx=stepFrom(w,fs);R[p].adj[nx]=(R[p].adj[nx]||0)+amt}};
  for(const m of S.moves){const w=wk(m.date);ap(m.from,-m.amount,w);ap(m.to,m.amount,w)}
  const out={cw};const L=weekStarts();
  for(const p of POOLS){const r=R[p];let c=r.cush;
    for(const w of L){if(w<cw)c+=budgetFor(p,w)+(r.adj[w]||0)-(r.spent[w]||0)}
    const budget=budgetFor(p,cw),alloc=budget+(r.adj[cw]||0),spent=r.spent[cw]||0;
    out[p]={budget,alloc,spent,left:alloc-spent,cushion:c,nextAdj:r.adj[stepFrom(cw,fs)]||0}}
  return out;
}

function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2600)}
function fail(e){console.error(e);toast(e?.code==="42501"?"You don't have permission to change that.":"Couldn't save. Check your connection and try again.")}

/* ---------- render ---------- */
function render(){
  const app=document.getElementById("app");
  if(!S.ready){return}
  if(!db){app.innerHTML=`<header><div><div class="label">Family Budget</div><h1>Family Budget</h1></div></header><div class="empty">This budget syncs through Claude. Open it from the Claude app or claude.ai while signed in to see and log spending.</div>`;return}
  if(!S.settingsLoaded){return}

function rescueOptions(c,p){
  const need=Math.round(-c[p].left*100)/100,opts=[];
  const add=(ep,label,avail,why,tier)=>{if(avail>0.004)opts.push({ep,label,amt:Math.round(Math.min(need,avail)*100)/100,full:avail>=need-0.004,why,tier})};
  const f=weekFrac(c),nb=budgetFor(p,nextReset())+(c[p].nextAdj||0);
  add(`next:${p}`,`${NAMES[p]} next ${PER().noun}`,nb,`Next ${PER().noun} ${NAMES[p]} gets less, so it evens out.`,0);
  add(`cushion:${p}`,`${NAMES[p]}'s splurge`,c[p].cushion,"Your own saved leftovers. Nothing else changes.",1);
  if(p!=="extras"){add("week:extras",`${NAMES.extras} ${PER().this}`,c.extras.left,"That's what Extras is for.",2);add("cushion:extras",`${NAMES.extras} splurge`,c.extras.cushion,"Saved odds-and-ends money.",2)}
  for(const q of POOLS)if(q!==p&&q!=="extras")add(`cushion:${q}`,`${NAMES[q]}'s splurge`,c[q].cushion,`Uses ${NAMES[q]}'s saved leftovers.`,3);
  for(const q of POOLS)if(q!==p&&q!=="extras"){const room=c[q].left-Math.max(0,c[q].alloc*(1-f));add(`week:${q}`,`${NAMES[q]} ${PER().this}`,Math.max(0,room),`${NAMES[q]} is under pace, so there's room.`,4)}
  if(S.plan){const P=S.plan,bal=+P.accounts?.usaa||0,inB=(P.goals||[]).filter(g=>!g.done).reduce((s,g)=>s+(+g.saved||0),0),free=Math.max(0,bal-Math.max(+P.floor||0,0)-inB);
    add("usaa",`${L().save} (unassigned savings)`,free,"Real savings. Use it if nothing above covers it.",5)}
  opts.sort((a,b)=>a.tier-b.tier||b.amt-a.amt);
  return {need,opts};
}
function rescueBanner(c){
  const over=POOLS.filter(p=>c[p].left<-0.004);
  if(!over.length)return "";
  return over.map(p=>{
    const {need,opts}=rescueOptions(c,p),best=opts[0];

        <li><div class="grow"><b>${opts.length?"Last resort: ":""}Leave it</b><div class="small muted">It comes out of ${esc(NAMES[p])}'s splurge when the ${PER().noun} resets${c[p].cushion+c[p].left<0?`, which puts it ${m2(-(c[p].cushion+c[p].left))} in the hole`:""}.</div></div></li></ol>

/* ---------- budget health: fire / green / yellow / red ---------- */
function weekFrac(c){const len=Math.max(1,nextReset()-c.cw),day=dn(todayS())-c.cw+1;return Math.min(1,Math.max(0,day/len))}
function poolStatus(x,frac){
  if(x.left<-0.004)return x.cushion+x.left>=0?"warn":"bad";
  if(x.alloc<=0)return "good";
  const used=x.spent/x.alloc;
  if(used>=0.9&&frac<0.85)return "warn";
  if(used>frac+0.15)return "warn";
  if(frac>=0.3&&used<=frac*0.7)return "fire";
  return "good";
}
function overallStatus(c,pools){
  const f=weekFrac(c),st=pools.map(p=>poolStatus(c[p],f));
  if(st.includes("bad"))return "bad";if(st.includes("warn"))return "warn";
  const spent=pools.reduce((s,p)=>s+c[p].spent,0),alloc=pools.reduce((s,p)=>s+c[p].alloc,0);
  if(f>=0.3&&alloc>0&&spent/alloc<=f*0.7)return "fire";
  return "good";
}
const STATUS={fire:["🔥","Ahead of plan","Spending is well under pace. Nice."],good:["🟢","On track","Spending is right where it should be."],warn:["🟡","Be careful","Something is running ahead of pace or close to its limit."],bad:["🔴","Over budget","A card is over and its cushion can't cover it. Move money or pause spending."]};
function statusBanner(c,pools){const s=overallStatus(c,pools),[em,t,d]=STATUS[s];
  return `<div class="status ${s}"><span class="em" aria-hidden="true">${em}</span><div><b>${t}</b><div class="small muted">${d}</div></div></div>`}

/* ---------- manual bills: ask if they were paid ---------- */
function manualDue(){
  if(!S.plan)return [];const today=dn(todayS()),sn=S.plan.snooze||{},me=monthEndWindow(),out=[];
  for(const r of billRows()){
    if(sn[r.key]===todayS())continue;
    const va=isVar(r.b),ap=autopayOn(r.b),hasAmt=S.plan.varAmt?.[r.key]!=null;
    if(!r.paid&&!ap&&(r.due===null?me:(r.due<=today&&(r.due>=today-7||me)))){out.push({...r,ask:"paid"});continue}
    if(va&&r.paid&&!hasAmt&&me)out.push({...r,ask:"amount"});
  }
  return out;
}

  const rows=manualDue();if(!rows.length)return "";const today=dn(todayS());

    <div class="list">${rows.map(r=>{
      if(S.payOpen===r.key||S.varOpen===r.key)return billRowHtml(r,today);

      if(r.ask==="amount")return `<div class="item"><div class="grow"><div>${esc(r.b.name)}</div><div class="small muted">Paid · enter the real amount (estimate was ${m2(billAmt(r.b,r.key))})</div></div>

        <button class="btn sm ghost" data-act="snooze" data-key="${esc(r.key)}">Not yet</button></div></div>`}).join("")}</div>

}

function epLabel(ep){if(ep.startsWith("next:"))return `${NAMES[ep.slice(5)]} next ${PER().noun}`;if(ep==="usaa")return (S.plan?L().save:"Savings")+" savings";if(ep.startsWith("event:"))return poolName(ep)+" (special)";const [k,p]=ep.split(":");return `${NAMES[p]} ${k==="week"?PER().this:"cushion"}`}
function epAvail(ep,c){if(ep==="usaa")return null;if(ep.startsWith("event:")){const e=S.events.find(x=>"event:"+x.id===ep);return e?evStats(e).left:0}const [k,p]=ep.split(":");return k==="week"?c[p].left:c[p].cushion}
function eps(){const e=[];for(const p of POOLS){e.push(`week:${p}`,`cushion:${p}`)}for(const v of activeEvents())e.push("event:"+v.id);e.push("usaa");return e}

/* ---------- plan (owner only; stored so only the owner can read it) ---------- */
function billTotal(phase){return (S.plan?.bills||[]).filter(b=>!b.phase||b.phase==="both"||b.phase===phase).reduce((s,b)=>s+(+b.amt||0),0)}
const closingOn=()=>!!S.plan?.closingMode;
const L=()=>({save:S.plan?.labels?.save||"USAA",bills:S.plan?.labels?.bills||"Chase"});
const BLANK_PLAN={accounts:{usaa:0,chase:0},otherAccts:[],floor:0,bills:[],debts:[],goals:[{name:"Emergency fund",saved:0,target:1000,monthly:0,when:"Start here",done:false},{name:"Car repairs",saved:0,target:0,monthly:0,when:"",done:false},{name:"Holidays and birthdays",saved:0,target:0,monthly:0,when:"",done:false},{name:"Vacation",saved:0,target:0,monthly:0,when:"",done:false}],paid:[],paycheck:{aspen:0,grace:0,graceBills:0},postClosing:false,labels:{save:"Savings",bills:"Bills account"}};

/* Bills: this month's cycle per bill, with a paid check. */
function dayOf(b){const n=parseInt(String(b.day||"").replace(/\D/g,""),10);return n>=1&&n<=31?n:null}
function dueIn(y,m,d){const last=new Date(Date.UTC(y,m+1,0)).getUTCDate();return Math.round(Date.UTC(y,m,Math.min(d,last))/DAY)}
function nextPayday(){const a=dn(S.plan?.payAnchor||anchor()),t=dn(todayS());let p=a;while(p<=t)p+=14;return p}
function billRows(){
  const P=S.plan,phase=P.postClosing?"post":"pre",t=new Date(),y=t.getFullYear(),m=t.getMonth(),today=dn(todayS());
  const paid=new Set(P.paid||[]);
  return (P.bills||[]).map((b,i)=>({b,i})).filter(x=>!x.b.phase||x.b.phase==="both"||x.b.phase===phase).map(x=>{
    const d=dayOf(x.b);if(d===null)return {...x,due:null,paid:paid.has(x.b.name+"|"+ym(y,m)),key:x.b.name+"|"+ym(y,m)};
    const due=dueIn(y,m,d),key=x.b.name+"|"+ds(due).slice(0,7);
    return {...x,due,key,paid:paid.has(key),late:!paid.has(key)&&due<today};
  }).sort((a,b)=>(a.due??1e9)-(b.due??1e9));
}
function ordinal(n){const s=["th","st","nd","rd"],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0])}
function ym(y,m){return `${y}-${pad(m+1)}`}
function billsCard(){
  const P=S.plan,rows=billRows(),pay=nextPayday(),today=dn(todayS()),lb=L();
  const t=new Date(),y=t.getFullYear(),m=t.getMonth();
  /* due before payday: this month's unpaid ones before payday, plus next month's early ones if payday crosses the month */
  const beforePay=dueBeforePayday("chase"),fromSav=dueBeforePayday("usaa");
  const total=rows.reduce((s,r)=>s+billAmt(r.b,r.key),0),paidAmt=rows.filter(r=>r.paid).reduce((s,r)=>s+(paidInfo(r.key)?.amount??billAmt(r.b,r.key)),0);
  const needAmt=rows.filter(r=>isVar(r.b)&&!r.paid&&S.plan?.varAmt?.[r.key]==null);
  const chase=+P.accounts?.chase||0,cover=chase-beforePay;
  const month=t.toLocaleDateString("en-US",{month:"long"});
  return `<div class="card"><h2>${esc(month)} bills</h2>
    <div class="split">
      <span>${esc(lb.bills)} bills due before payday (${short(pay)})</span><b class="num">${m2(beforePay)}</b>
      <span class="muted small">${esc(lb.bills)} balance now</span><b class="num small">${m2(chase)}</b>
    </div>
    <span class="chip ${cover<0?"bad":cover<100?"warn":""}" style="margin-top:8px">${cover<0?`${m2(-cover)} short before payday`:`Covered, ${m2(cover)} to spare`}</span>
    ${fromSav>0?`<div class="small muted" style="margin-top:6px">Also coming out of ${esc(lb.save)} before payday: ${m2(fromSav)}</div>`:""}
    <div class="bar" style="margin-top:12px"><i style="width:${pct(paidAmt,total)}%"></i></div>
    <div class="muted small" style="margin-top:4px">${m0(paidAmt)} of ${m0(total)} paid this month</div>
    ${needAmt.length?`<div class="chip warn" style="margin-top:8px">Enter this month's amount: ${needAmt.map(r=>esc(r.b.name)).join(", ")}</div>`:""}
    <div class="list" style="margin-top:6px">${rows.map(r=>billRowHtml(r,today)).join("")}</div>
  </div>`;
}


/* ---------- bills: mark paid with amount + date ---------- */
function billAmt(b,key){const v=S.plan?.varAmt?.[key];return v!=null?+v:(+b.amt||0)}
function isVar(b){return !!b.variable}
function autopayOn(b){return !!dayOf(b)&&(isVar(b)?b.auto===true:b.auto!==false)}
function lastDayThisMonth(){const t=new Date();return new Date(t.getFullYear(),t.getMonth()+1,0).getDate()}
function monthEndWindow(){return new Date().getDate()>=lastDayThisMonth()-2}
function paidInfo(key){return (S.plan?.paidLog||[]).find(x=>x.key===key)}
function billRowHtml(r,today){
  const info=paidInfo(r.key);
  if(S.payOpen===r.key)return `<form class="item payform" id="payf" data-key="${esc(r.key)}" style="flex-wrap:wrap">
    <div class="grow" style="flex-basis:100%"><b>${esc(r.b.name)}</b></div>
    <label class="f" style="flex:1;min-width:110px">Amount paid<input id="pf-amt" inputmode="decimal" value="${esc(billAmt(r.b,r.key))}"></label>
    <label class="f" style="flex:1;min-width:130px">Date<input type="date" id="pf-date" value="${todayS()}"></label>
    <div class="row" style="flex-basis:100%"><button class="btn" type="submit">Save as paid</button><button class="btn ghost" type="button" data-act="paycancel">Cancel</button></div></form>`;
  const va=isVar(r.b),hasAmt=S.plan?.varAmt?.[r.key]!=null;
  if(S.varOpen===r.key)return `<form class="item payform" id="varf" data-key="${esc(r.key)}" style="flex-wrap:wrap">
    <div class="grow" style="flex-basis:100%"><b>${esc(r.b.name)}</b> <span class="small muted">this month's bill</span></div>
    <label class="f" style="flex:1;min-width:120px">Amount<input id="vf-amt" inputmode="decimal" value="${hasAmt?esc(billAmt(r.b,r.key)):""}" placeholder="${esc(r.b.amt)}"></label>
    <div class="row" style="flex-basis:100%"><button class="btn" type="submit">Save amount</button><button class="btn ghost" type="button" data-act="varcancel">Cancel</button></div></form>`;
  const when=r.paid?`Paid${info?.date?" "+short(dn(info.date)):""}${info&&Math.abs(info.amount-billAmt(r.b,r.key))>0.004?` · ${m2(info.amount)}`:""}`
    :r.due===null?"No due date":r.late?`Past due ${short(r.due)}`:r.due===today?"Due today":`Due ${short(r.due)}`;
  return `<div class="item">
    <span class="dot ${r.paid?"ok":r.late?"late":""}" aria-hidden="true"></span>
    <div class="grow"><div style="${r.paid?"color:var(--muted)":""}">${esc(r.b.name)}</div>
      <div class="small ${r.late&&!r.paid?"":"muted"}" style="${r.late&&!r.paid?"color:var(--bad)":""}">${when}</div></div>
    <div style="text-align:right"><b class="num" style="${r.paid?"color:var(--muted)":""}">${va&&!hasAmt&&!r.paid?"~":""}${m2(r.paid&&info?info.amount:billAmt(r.b,r.key))}</b>
      ${va&&!r.paid?`<div class="small">${hasAmt?`<button class="x" data-act="varopen" data-key="${esc(r.key)}">Change</button>`:`<button class="x" data-act="varopen" data-key="${esc(r.key)}" style="color:var(--warn)">Enter amount</button>`}</div>`:""}</div>
    ${r.paid?`<button class="x" data-act="billundo" data-key="${esc(r.key)}">Undo</button>`
      :`<button class="btn sm" data-act="payopen" data-key="${esc(r.key)}">Paid</button>`}
  </div>`;
}

/* ---------- income: paychecks and extra money ---------- */
function incomeSources(){return [["mine",`${NAMES.aspen}'s paycheck`],["partner",`${NAMES.grace}'s pay`],...(S.plan?.incomeTypes||[]).map(t=>[t.k,t.name]),["ot","Overtime / bonus"],["reimb","Reimbursement"],["other","Other"]]}
/* ---------- how a paycheck or extra money splits ---------- */
function chaseDueUntil(end){
  const P=S.plan,phase=P.postClosing?"post":"pre",paid=new Set(P.paid||[]),today=dn(todayS());let sum=0;const items=[];
  const t=new Date();for(let k=0;k<3;k++){const y=t.getFullYear()+Math.floor((t.getMonth()+k)/12),m=(t.getMonth()+k)%12;
    for(const b of P.bills||[]){if(!(!b.phase||b.phase==="both"||b.phase===phase)||billAcct(b)!=="chase")continue;const d=dayOf(b);if(d===null)continue;
      const due=dueIn(y,m,d),key=b.name+"|"+ds(due).slice(0,7);if(due<end&&!paid.has(key)&&due>=today-31){const am=billAmt(b,key);sum+=am;items.push({name:b.name,due,amt:am})}}}
  return {sum:Math.round(sum*100)/100,items:items.sort((a,b)=>a.due-b.due)};
}
function incomeSplit(amt,src,dateS){
  const P=S.plan,c=compute(),lb=L(),chase=+P.accounts?.chase||0;
  const d=dn(dateS||todayS()),end=Math.max(d,dn(todayS()))+14,due=chaseDueUntil(end);
  const short=Math.max(0,Math.round((due.sum-chase)*100)/100);
  if(src==="mine"){const toChase=Math.min(amt,short),spend=Math.round(POOLS.reduce((s,p)=>s+c[p].budget,0)*perCheckFactor()*100)/100;
    return {toChase,spend,toSave:Math.round((amt-toChase-spend)*100)/100,due,chase,end}}
  if(src==="partner"){const hers=Math.round((+P.paycheck?.graceBills||0)*12/26*100)/100;return {toChase:0,spend:0,hers,toSave:Math.round((amt-hers)*100)/100,due,chase,end}}
  const toChase=Math.min(amt,short);return {toChase,spend:0,toSave:Math.round((amt-toChase)*100)/100,due,chase,end};
}

  </div>

/* ---------- money vault ---------- */
function acctAdjust(which,delta){const P=S.plan;const r=v=>Math.round(v*100)/100;
  if(String(which).startsWith("x:")){const a=(P.otherAccts||[]).find(x=>x.id===which.slice(2));if(a)a.bal=r((+a.bal||0)+delta);return}
  P.accounts=P.accounts||{};P.accounts[which]=r((+P.accounts[which]||0)+delta)}
function acctList(){const P=S.plan||{},lb=L();return [{k:"usaa",name:lb.save},{k:"chase",name:lb.bills},...(P.otherAccts||[]).map(a=>{if(!a.id)a.id="a"+Math.random().toString(36).slice(2,8);return {k:"x:"+a.id,name:a.name}})]}
function acctName(k){return acctList().find(a=>a.k===k)?.name||"Account"}
function acctOpts(sel){return acctList().map(a=>`<option value="${esc(a.k)}" ${a.k===sel?"selected":""}>${esc(a.name)}</option>`).join("")}

/* ---------- where each kind of paycheck lands, and automatic amounts to other accounts ---------- */
function depRule(src){const d={home:"usaa",cover:src!=="partner",spend:src==="mine",splits:[]};return {...d,...(S.plan?.deposit?.[src]||{})}}
function depRuleSet(src){const P=S.plan;P.deposit=P.deposit||{};return P.deposit[src]=P.deposit[src]||depRule(src)}
function depositPlan(amt,src,dateS,goal){
  const P=S.plan,r=depRule(src),c=compute(),out={},add=(k,v)=>{if(v)out[k]=Math.round(((out[k]||0)+v)*100)/100};
  let left=amt;const auto=[];
  for(const x of r.splits||[]){const v=Math.min(left,Math.max(0,+x.amt||0));if(v>0){add(x.to,v);auto.push({to:x.to,amt:v});left-=v}}
  const spend=r.spend&&!goal?Math.min(left,Math.round(POOLS.reduce((s,p)=>s+c[p].budget,0)*perCheckFactor()*100)/100):0;left-=spend;
  add(r.home,left);
  const d=dn(dateS||todayS()),end=Math.max(d,dn(todayS()))+14,due=chaseDueUntil(end),chase=+P.accounts?.chase||0;
  let move=0;if(r.cover&&r.home!=="chase"){const short=Math.max(0,due.sum-chase-(out.chase||0));move=Math.min(short,out[r.home]||0);if(move>0){add(r.home,-move);add("chase",move)}}
  return {out,auto,spend,move,due,chase,end,rule:r};
}

/* ---------- autopay: bills come out on their due date ---------- */
function dueBeforePayday(acct){
  if(!S.plan)return 0;const rows=billRows().filter(r=>!acct||billAcct(r.b)===acct),pay=nextPayday(),t=new Date(),y=t.getFullYear(),m=t.getMonth();let sum=0;
  for(const r of rows){const d=dayOf(r.b);if(d===null)continue;if(!r.paid&&r.due<pay)sum+=billAmt(r.b,r.key);
    const nx=dueIn(m===11?y+1:y,(m+1)%12,d);if(nx<pay&&nx>r.due)sum+=billAmt(r.b,r.b.name+"|"+ds(nx).slice(0,7))}
  return sum;
}
function runAutopay(){
  if(!S.full||!S.plan)return;const P=S.plan,today=dn(todayS());
  if(!P.autoStart){P.autoStart=todayS();savePlan()}
  const start=dn(P.autoStart),skip=new Set(P.skipAuto||[]);let changed=0;const paid=new Set(P.paid||[]);
  for(const r of billRows()){
    if(!autopayOn(r.b)||r.paid||r.due>today||skip.has(r.key)||paid.has(r.key))continue;
    if(r.due<Math.max(start,r.b.added?dn(r.b.added):start))continue;
    const amt=billAmt(r.b,r.key);paid.add(r.key);
    P.paidLog=(P.paidLog||[]).filter(x=>x.key!==r.key).concat([{key:r.key,amount:amt,date:ds(r.due),auto:true,acct:billAcct(r.b)}]);
    acctAdjust(billAcct(r.b),-amt);changed++;
  }
  if(changed){P.paid=[...paid];savePlan();toast(`${changed} bill${changed>1?"s":""} paid automatically`)}
}
/* ---------- what if I spend ---------- */
function runScenario(amt,pool){
  const c=compute(),steps=[];let need=amt;
  const take=(label,avail,ep)=>{if(need<=0.004||!(avail>0))return;const x=Math.min(need,avail);steps.push({label,x,ep});need-=x};
  if(pool!=="none"){take(`${NAMES[pool]} ${PER().this}`,c[pool].left,null);take(`${NAMES[pool]}'s cushion`,c[pool].cushion,`cushion:${pool}`)}
  if(pool!=="extras"){take(`${NAMES.extras} ${PER().this}`,c.extras.left,"week:extras");take(`${NAMES.extras} cushion`,c.extras.cushion,"cushion:extras")}
  for(const q of POOLS)if(q!==pool&&q!=="extras")take(`${NAMES[q]}'s cushion`,c[q].cushion,`cushion:${q}`);
  if(S.plan){const P=S.plan,bal=+P.accounts?.usaa||0,inB=(P.goals||[]).filter(g=>!g.done).reduce((s,g)=>s+(+g.saved||0),0);
    take(`${L().save}, unassigned and above the floor`,Math.max(0,bal-Math.max(+P.floor||0,0)-inB),"usaa")}
  return {steps,short:Math.max(0,Math.round(need*100)/100),pool,amt};
}

/* ---------- paycheck planner ---------- */
function payPlanner(P,c,perCheck,spend,gNet,post){

  const take=takeRaw/100,base=rate*baseH,otg=rate*1.5*ot,gross=base+otg,net=gross*take,normNet=(base+rate*1.5*normOt)*take,extra=net-normNet;
  const routes=P.routing||[],routed=perCheck+spend+routes.reduce((s,r)=>s+(+r.amt||0),0),left=net-routed;
  const last=[...(P.income||[])].filter(x=>x.src==="mine").sort((a,b)=>b.date<a.date?-1:1)[0];
  return `<div class="card"><h2>Paycheck planner</h2>

      <label class="f">Normal OT hours<input data-plan="pay.normalOt" inputmode="decimal" value="${esc(normOt)}"></label>
      <label class="f">Take-home %<input data-plan="pay.takeHome" inputmode="decimal" value="${esc(takeRaw)}"></label></div>
      ${last&&gross>0?`<div class="muted small" style="margin-top:6px">Your ${short(dn(last.date))} check was ${m2(last.amt)}. Adjust Take-home % until the estimate matches a real check.</div>`:""}</details>

      <div><span>OT gross (${esc(ot)} hrs)</span><b>${m2(otg)}</b></div>
      <div class="strong"><span>Estimated take-home</span><b>${m2(net)}</b></div>

async function setPeriod(kind){

    const f=PERIOD[kind].days/PERIOD[oldKind].days,entry={from};
    for(const p of POOLS){entry[p]=Math.round(budgetFor(p,before)*f)}hist.push(entry)}

async function shrinkImage(file){
  const url=URL.createObjectURL(file);const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
  const max=1600,sc=Math.min(1,max/Math.max(img.width,img.height)),cv=document.createElement("canvas");cv.width=Math.round(img.width*sc);cv.height=Math.round(img.height*sc);
  cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);URL.revokeObjectURL(url);
  const blob=await new Promise(r=>cv.toBlob(r,"image/jpeg",0.72));return {blob,url:URL.createObjectURL(blob),canvas:cv};
}
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
const AUTO_MAX=500;
function findTotal(text){
  const lines=text.split(/\n/).map(l=>l.trim()).filter(Boolean);const amt=l=>{const m=[...l.matchAll(/(\d{1,4}[.,]\d{2})\b/g)].map(x=>parseFloat(x[1].replace(",",".")));return m.length?m[m.length-1]:null};
  for(const re of [/\b(grand\s*)?total\b(?!.*(sub|savings|items|tax))/i,/amount\s*(due|paid)|balance\s*due|you\s*paid/i]){for(let i=lines.length-1;i>=0;i--){if(re.test(lines[i])){const v=amt(lines[i])??amt(lines[i+1]||"");if(v)return {v,sure:true}}}}
  const all=lines.map(amt).filter(v=>v!=null&&v<5000);return all.length?{v:Math.max(...all),sure:false}:null;
}
function findStore(text){const l=text.split(/\n/).map(x=>x.trim()).find(x=>/[A-Za-z]{3,}/.test(x)&&x.length<32);return l?l.replace(/[^\w&' .-]/g,"").trim():""}
let ocrW=null,rqBusy=false;S.rq=[];
async function ocr(canvas){
  if(!window.Tesseract)await loadScript("https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js");
  if(!ocrW)ocrW=await window.Tesseract.createWorker("eng");
  const r=await ocrW.recognize(canvas);return r?.data?.text||"";
}
async function logReceiptTxn(q){
  const row=chk(await sb.from("wb_txns").insert({household_id:HID,pool:q.pool,amount:q.total,src:"week",date:todayS()}).select("id").single());
  let receipt=null;
  if(q.blob){const path=`${ME}/${row.id}.jpg`;const up=await sb.storage.from("receipts").upload(path,q.blob,{contentType:"image/jpeg",upsert:true});if(!up.error)receipt=path}
  chk(await sb.from("wb_txn_notes").insert({txn_id:row.id,household_id:HID,shared:!["aspen","grace"].includes(q.pool),note:q.store||"Receipt",cat:null,receipt}));
  q.txnId=row.id;q.path=receipt;q.state="logged";
  await LOAD.txns();
}
async function addReceipts(files,pool){
  for(const f of files){const r=await shrinkImage(f);S.rq.unshift({id:Math.random().toString(36).slice(2),url:r.url,blob:r.blob,canvas:r.canvas,pool,state:"reading"})}
  render();pumpQueue();
}
async function pumpQueue(){
  if(rqBusy)return;rqBusy=true;
  try{let q;while((q=S.rq.find(x=>x.state==="reading"))){
    try{const text=await ocr(q.canvas);const t=findTotal(text);q.store=findStore(text);q.canvas=null;
      if(t&&t.sure&&t.v<=AUTO_MAX){q.total=t.v;await logReceiptTxn(q)}
      else{q.total=t?t.v:null;q.state="needs";q.why=!t?"Couldn't read the total. Type it in.":t.v>AUTO_MAX?"Big amount. Check it, then log it.":"Not sure this is the total. Check it."}
    }catch(err){console.error(err);q.canvas=null;q.state="needs";q.why="Couldn't read it. Type the total in."}
    render();
  }}finally{rqBusy=false}
}
function receiptQueue(){
  if(!S.rq||!S.rq.length)return "";
  return `<div class="rq">${S.rq.map(q=>`<div class="rq-item">
    <img src="${q.url}" class="rthumb" alt="Receipt" data-act="rzoom" data-id="${q.id}">
    <div class="grow">${q.state==="reading"?`<div>Reading…</div><div class="small muted">${esc(poolName(q.pool))}</div>`
      :q.state==="logged"?`<div><b class="num">${m2(q.total)}</b> ${esc(q.store||"")}</div><div class="small muted">Taken out of ${esc(poolName(q.pool))}</div>`
      :`<div class="small" style="color:var(--warn)">${esc(q.why||"")}</div><div class="rq-fix"><input id="rq-${q.id}" inputmode="decimal" placeholder="Total" value="${q.total?q.total.toFixed(2):""}"><button type="button" class="btn sm" data-act="rqsave" data-id="${q.id}">Log it</button></div>`}</div>
    ${q.state==="logged"?`<button type="button" class="x" data-act="rqundo" data-id="${q.id}">Undo</button>`:q.state==="needs"?`<button type="button" class="x" data-act="rqdrop" data-id="${q.id}" aria-label="Remove">✕</button>`:""}
  </div>`).join("")}
  ${S.rq.every(q=>q.state!=="reading")?`<button type="button" class="x" data-act="rqclear">Clear this list</button>`:""}</div>`;
}

      <button class="btn ghost" type="submit">Join</button></form>
    <button class="btn ghost" data-act="signout">Sign out</button></div>`;
  return `<div class="login">${logo}<h1>Family Budget</h1><div class="muted">Sign in with your email and password.</div>
    <form class="card" id="loginf">
      <label class="f">Email<input type="email" id="le" autocomplete="username" required></label>
      <label class="f">Password<input type="password" id="lp" autocomplete="current-password"></label>
      <button class="btn" type="submit">Sign in</button>
      <button class="btn ghost" type="button" data-act="forgot">Forgot password? Email me a reset link</button>
      <button class="btn ghost" type="button" data-act="tosignup">New here? Create an account</button>
    </form></div>`;
}
function showLogin(mode){S.ready=false;document.getElementById("app").innerHTML=loginView(mode)}

document.addEventListener("submit",async e=>{
  const f=e.target;
  if(f.id==="loginf"){e.preventDefault();const email=val("le").trim(),password=val("lp");
    if(!password){toast("Enter your password, or tap Forgot password");return}
    const r=await sb.auth.signInWithPassword({email,password});if(r.error){toast("That email and password didn't match. Try again or reset your password.");return}start()}
  if(f.id==="signupf"){e.preventDefault();const r=await sb.auth.signUp({email:val("se").trim(),password:val("sp"),options:{emailRedirectTo:location.origin+location.pathname}});
    if(r.error){toast(r.error.message);return}
    if(!r.data.session){showLogin("checkemail");return}start()}
  if(f.id==="hhcreatef"){e.preventDefault();const r=await sb.rpc("create_my_household",{household_name:"Our Household",my_display_name:val("hc-me").trim()||null});
    if(r.error){toast(r.error.message);return}start()}
  if(f.id==="hhjoinf"){e.preventDefault();const r=await sb.rpc("join_my_household",{household_code:val("hj-code").trim(),my_display_name:val("hj-me").trim()||null});
    if(r.error){toast(/Invalid/.test(r.error.message)?"That code didn't match. Check it with your partner.":r.error.message);return}start()}
  if(f.id==="newpwf"){e.preventDefault();const r=await sb.auth.updateUser({password:val("np")});
    if(r.error){toast(r.error.message);return}toast("Password saved");history.replaceState(null,"",location.pathname);start()}
});
document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-act]");if(!b)return;
  if(b.dataset.act==="forgot"){const email=val("le").trim();if(!email){toast("Type your email first");return}
    const r=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});
    toast(r.error?"Couldn't send the email. Try again in a minute.":"Check your email for the reset link")}
  if(b.dataset.act==="tosignup"){showLogin("signup");return}
  if(b.dataset.act==="tologin"){showLogin();return}
  if(b.dataset.act==="signout"){await sb.auth.signOut();if(channel)sb.removeChannel(channel);showLogin()}
  if(b.dataset.act==="push")enablePush(b);
});

/* ---------- notifications ---------- */
function b64(s){const p="=".repeat((4-s.length%4)%4);const r=atob((s+p).replace(/-/g,"+").replace(/_/g,"/"));return Uint8Array.from([...r].map(c=>c.charCodeAt(0)))}
function myTZ(){try{return Intl.DateTimeFormat().resolvedOptions().timeZone||"America/New_York"}catch{return "America/New_York"}}
async function syncTZ(){try{if(!("serviceWorker" in navigator))return;const reg=await navigator.serviceWorker.getRegistration();const sub=await reg?.pushManager?.getSubscription();
  if(sub)await sb.from("push_subscriptions").update({tz:myTZ()}).eq("endpoint",sub.endpoint).neq("tz",myTZ())}catch{}}
async function enablePush(btn){
  const ios=/iphone|ipad/i.test(navigator.userAgent),standalone=window.navigator.standalone||matchMedia("(display-mode: standalone)").matches;
  if(ios&&!standalone){toast("First add this app to your Home Screen: Share → Add to Home Screen. Then open it from there.");return}
  if(!("serviceWorker" in navigator)||!("PushManager" in window)){toast("This browser can't show notifications");return}
  try{
    const perm=await Notification.requestPermission();if(perm!=="granted"){toast("Notifications are turned off for this app in your phone's settings");return}
    const reg=await navigator.serviceWorker.register("sw.js");await navigator.serviceWorker.ready;
    const sub=(await reg.pushManager.getSubscription())||await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64(VAPID)});
    const j=sub.toJSON();
    chk(await sb.from("push_subscriptions").upsert({user_id:ME,endpoint:j.endpoint,p256dh:j.keys.p256dh,auth_key:j.keys.auth,tz:myTZ(),updated_at:new Date().toISOString()},{onConflict:"endpoint"}));
    toast("You'll get your numbers every night at 7 PM");if(btn)btn.textContent="Notifications are on";
  }catch(err){console.error(err);toast("Couldn't turn on notifications. Try again.")}
}
function pushButton(){return `<button class="btn ghost" data-act="push">Turn on 7 PM notifications</button>`}

/* ---------- start ---------- */
async function start(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){showLogin();return}
  ME=session.user.id;
  const mem=chk(await sb.from("household_members").select("household_id").eq("user_id",ME).maybeSingle());
  if(!mem){showLogin("household");return}
  HID=mem.household_id;
  const hh=chk(await sb.from("households").select("created_by,join_code").eq("id",HID).maybeSingle());S.joinCode=hh?.join_code||"";
  S.owner=hh?.created_by===ME;
  try{await LOAD.settings();await Promise.all(Object.entries(LOAD).filter(([k])=>k!=="settings").map(([,f])=>f()))}catch(err){fail(err)}
  S.full=S.owner||!!S.settings?.partnerFull;S.view=S.full?"aspen":"grace";S.aPool=S.owner?"aspen":"grace";
  try{const pr=await sb.from("wb_prefs").select("data").eq("user_id",ME).maybeSingle();S.prefs=pr.data?.data||{}}catch(_){S.prefs={}}
  S.ready=true;render();runAutopay();syncTZ();
  if(channel)sb.removeChannel(channel);
  channel=sb.channel("wb-"+HID);
  for(const [t,k] of [["wb_settings","settings"],["wb_txns","txns"],["wb_txn_notes","txns"],["wb_moves","moves"],["wb_events","events"],["wb_plan","plan"]]){
    if(k==="plan"&&!S.full)continue;
    channel.on("postgres_changes",{event:"*",schema:"public",table:t,filter:`household_id=eq.${HID}`},()=>{LOAD[k]().then(render).catch(()=>{})});
  }
  channel.subscribe();
  document.addEventListener("visibilitychange",()=>{if(!document.hidden&&HID)Promise.all(Object.values(LOAD).map(f=>f())).then(render).catch(()=>{})});
}
sb.auth.onAuthStateChange((ev)=>{if(ev==="PASSWORD_RECOVERY")showLogin("recover")});
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
if(/type=recovery/.test(location.hash)){/* recovery link: onAuthStateChange shows the form */}else start();
</script>
